# Builds para as lojas. Os projetos nativos são gerados a cada build por scripts/native-setup.sh.
# Antes do primeiro build, no painel do Codemagic:
#  - Android: Team settings > Code signing identities > Android keystores: chave com o nome "eriachao_keystore"
#  - iOS: Team settings > Integrations > App Store Connect: chave de API com o nome "Codemagic",
#         e em Code signing identities: certificado de distribuição + perfil App Store de com.riachao.cidadao
workflows:
  android-workflow:
    name: Android (Google Play)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
      android_signing:
        - eriachao_keystore
    scripts:
      - name: Dependências e build web
        script: |
          npm install
          npm run build
      - name: Projeto Android
        script: perl -pi -e 's/\r$//' scripts/native-setup.sh && bash scripts/native-setup.sh android
      - name: AAB assinado
        script: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

  # Teste sem conta Google Play: APK que pode ser instalado direto em qualquer Android
  android-teste:
    name: Android Teste (APK sem conta)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    scripts:
      - name: Dependências e build web
        script: |
          npm install
          npm run build
      - name: Projeto Android
        script: perl -pi -e 's/\r$//' scripts/native-setup.sh && bash scripts/native-setup.sh android
      - name: APK de teste
        script: cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  ios-workflow:
    name: iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.riachao.cidadao
    scripts:
      - name: Dependências e build web
        script: |
          npm install
          npm run build
      - name: Projeto iOS
        script: perl -pi -e 's/\r$//' scripts/native-setup.sh && bash scripts/native-setup.sh ios
      - name: Assinatura
        script: xcode-project use-profiles
      - name: IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Teste sem conta Apple (nada assinado):
  #  - App.zip: envie em appetize.io para abrir num iPhone virtual pelo navegador
  #  - App-sem-assinatura.ipa: instale no seu iPhone pelo Sideloadly (Windows) com seu Apple ID grátis
  #    (vale 7 dias; push não funciona em conta grátis)
  ios-simulator:
    name: iOS Teste (sem conta Apple)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Dependências e build web
        script: |
          npm install
          npm run build
      - name: Projeto iOS
        script: perl -pi -e 's/\r$//' scripts/native-setup.sh && bash scripts/native-setup.sh ios
      - name: App para simulador
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build/sim ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          cd build/sim/Build/Products/Debug-iphonesimulator && zip -qr "$CM_BUILD_DIR/App.zip" App.app
      - name: IPA sem assinatura (iPhone)
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphoneos -configuration Release \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload && cp -R build/device/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr App-sem-assinatura.ipa Payload
    artifacts:
      - App.zip
      - App-sem-assinatura.ipa
